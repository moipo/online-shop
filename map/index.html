<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Карта MapLibre</title>

    <link rel="stylesheet" href="maplibre/maplibre-gl.css" />

    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      #controls {
        position: absolute;
        z-index: 1;
        top: 16px;
        left: 16px;
        width: min(320px, calc(100% - 32px));
        padding: 16px;
        box-sizing: border-box;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
        font: 14px/1.4 Arial, sans-serif;
      }

      #controls p {
        margin: 8px 0 12px;
      }

      #select-place {
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        font: inherit;
      }

      #select-place:disabled {
        background: #9ca3af;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <section id="controls">
      <strong>Выбор места</strong>
      <p id="selection-status">Загрузка точек…</p>
      <button id="select-place" type="button" disabled>Выбрать место</button>
    </section>

    <script src="points.js"></script>
    <script type="module">
      import * as maplibregl from './maplibre/maplibre-gl.mjs';

      const points = (window.CDEK_POINTS || []).map(([lng, lat, name, phone], i) => ({
        id: i + 1,
        name: name || 'СДЭК',
        phone: phone || '',
        coordinates: [lng, lat]
      }));

      const map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {
            osm: {
              type: 'raster',
              tiles: [
                'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
                'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
                'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
              ],
              tileSize: 256,
              minzoom: 0,
              maxzoom: 19,
              attribution: '&copy; OpenStreetMap contributors'
            }
          },
          layers: [
            {
              id: 'osm',
              type: 'raster',
              source: 'osm'
            }
          ]
        },
        center: [100, 61],
        zoom: 1.5,
        maxZoom: 19,
        maplibreLogo: true
      });

      map.addControl(new maplibregl.NavigationControl(), 'top-right');

      map.once('load', () => {
        map.fitBounds(
          [
            [19, 41],
            [180, 82]
          ],
          { padding: 30 }
        );
      });

      const status = document.querySelector('#selection-status');
      const selectButton = document.querySelector('#select-place');
      const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 12 });
      let selectedPoint = null;
      let selectedId = null;

      const labelFor = (point) =>
        point.phone ? `${point.name} — ${point.phone}` : point.name;

      map.on('load', () => {
        map.addSource('cdek', {
          type: 'geojson',
          data: {
            type: 'FeatureCollection',
            features: points.map((point) => ({
              type: 'Feature',
              id: point.id,
              properties: point,
              geometry: {
                type: 'Point',
                coordinates: point.coordinates
              }
            }))
          }
        });

        map.addLayer({
          id: 'cdek-points',
          type: 'circle',
          source: 'cdek',
          paint: {
            'circle-radius': [
              'case',
              ['boolean', ['feature-state', 'selected'], false],
              12,
              9
            ],
            'circle-color': [
              'case',
              ['boolean', ['feature-state', 'selected'], false],
              '#dc2626',
              '#2563eb'
            ],
            'circle-stroke-width': 2,
            'circle-stroke-color': '#ffffff'
          }
        });

        status.textContent = `Нажмите на одну из ${points.length} точек на карте.`;

        map.on('click', 'cdek-points', (e) => {
          const feature = e.features[0];
          const point = feature.properties;

          if (selectedId !== null) {
            map.setFeatureState({ source: 'cdek', id: selectedId }, { selected: false });
          }

          selectedId = feature.id;
          selectedPoint = point;
          map.setFeatureState({ source: 'cdek', id: selectedId }, { selected: true });
          selectButton.disabled = false;
          status.textContent = `Выбран ПВЗ: ${labelFor(point)}`;
        });

        map.on('mouseenter', 'cdek-points', (e) => {
          map.getCanvas().style.cursor = 'pointer';
          popup.setLngLat(e.lngLat).setText(labelFor(e.features[0].properties)).addTo(map);
        });

        map.on('mouseleave', 'cdek-points', () => {
          map.getCanvas().style.cursor = '';
          popup.remove();
        });

        map.on('click', (e) => {
          const hits = map.queryRenderedFeatures(e.point, { layers: ['cdek-points'] });
          if (hits.length === 0 && selectedId !== null) {
            map.setFeatureState({ source: 'cdek', id: selectedId }, { selected: false });
            selectedId = null;
            selectedPoint = null;
            selectButton.disabled = true;
            status.textContent = `Нажмите на одну из ${points.length} точек на карте.`;
          }
        });
      });

      selectButton.addEventListener('click', () => {
        if (!selectedPoint) {
          return;
        }

        const placeData = {
          id: selectedPoint.id,
          name: selectedPoint.name,
          phone: selectedPoint.phone,
          longitude: selectedPoint.coordinates[0],
          latitude: selectedPoint.coordinates[1]
        };

        console.log('Выбранное место:', placeData);
        status.textContent = 'Данные выбранного места записаны в консоль.';
      });
    </script>
  </body>
</html>
