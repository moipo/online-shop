<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Карта MapLibre</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.css"
    />

    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      #controls {
        position: absolute;
        z-index: 1;
        top: 16px;
        left: 16px;
        width: min(320px, calc(100% - 32px));
        padding: 16px;
        box-sizing: border-box;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
        font: 14px/1.4 Arial, sans-serif;
      }

      #controls p {
        margin: 8px 0 12px;
      }

      #select-place {
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        font: inherit;
      }

      #select-place:disabled {
        background: #9ca3af;
        cursor: not-allowed;
      }

      .point-marker {
        width: 18px;
        height: 18px;
        padding: 0;
        border: 2px solid #fff;
        border-radius: 50%;
        background: #2563eb;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.45);
        cursor: pointer;
      }

      .point-marker.selected {
        width: 24px;
        height: 24px;
        background: #dc2626;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <section id="controls">
      <strong>Выбор места</strong>
      <p id="selection-status">Нажмите на одну из 20 точек на карте.</p>
      <button id="select-place" type="button" disabled>Выбрать место</button>
    </section>

    <script type="module">
      import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.mjs';

      const pointZones = [
        { region: 'Калининградская область', center: [20.5, 54.8], spread: [1, 0.5] },
        { region: 'Санкт-Петербург и область', center: [30.3, 59.9], spread: [1.2, 0.5] },
        { region: 'Центральная Россия', center: [37.6, 55.75], spread: [1.8, 1] },
        { region: 'Нижегородская область', center: [44, 56.3], spread: [1.2, 0.8] },
        { region: 'Ростовская область', center: [39.7, 47.2], spread: [1.5, 0.7] },
        { region: 'Волгоградская область', center: [44.5, 48.7], spread: [1.5, 0.8] },
        { region: 'Татарстан', center: [49.1, 55.8], spread: [1.5, 0.8] },
        { region: 'Уральский регион', center: [60.6, 56.8], spread: [1.8, 1] },
        { region: 'Оренбургская область', center: [55.1, 51.8], spread: [1.8, 0.8] },
        { region: 'Башкортостан', center: [56, 54.7], spread: [1.2, 0.7] },
        { region: 'Челябинская область', center: [61.4, 55.2], spread: [1.3, 0.7] },
        { region: 'Тюменская область', center: [65.5, 57.1], spread: [1.5, 1] },
        { region: 'Омская область', center: [73.4, 55], spread: [1.4, 0.8] },
        { region: 'Новосибирская область', center: [82.9, 55], spread: [1.7, 0.8] },
        { region: 'Красноярский край', center: [92.9, 56], spread: [1.7, 0.8] },
        { region: 'Иркутская область', center: [104.3, 52.3], spread: [1.5, 0.8] },
        { region: 'Якутия', center: [129.7, 62], spread: [1.8, 1] },
        { region: 'Приморский край', center: [131.9, 43.1], spread: [1.5, 0.7] },
        { region: 'Хабаровский край', center: [135.1, 48.5], spread: [1.8, 0.8] },
        { region: 'Магаданская область', center: [150.8, 59.6], spread: [1.5, 0.8] }
      ];

      const points = pointZones.map((zone, index) => ({
        id: index + 1,
        region: zone.region,
        coordinates: [
          Number((zone.center[0] + (Math.random() - 0.5) * zone.spread[0]).toFixed(6)),
          Number((zone.center[1] + (Math.random() - 0.5) * zone.spread[1]).toFixed(6))
        ]
      }));

      const map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {
            osm: {
              type: 'raster',
              tiles: [
                'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
                'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
                'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
              ],
              tileSize: 256,
              minzoom: 0,
              maxzoom: 19,
              attribution: '&copy; OpenStreetMap contributors'
            }
          },
          layers: [
            {
              id: 'osm',
              type: 'raster',
              source: 'osm'
            }
          ]
        },
        center: [100, 61],
        zoom: 1.5,
        maxZoom: 19,
        maplibreLogo: true
      });

      map.addControl(new maplibregl.NavigationControl(), 'top-right');

      map.once('load', () => {
        map.fitBounds(
          [
            [19, 41],
            [180, 82]
          ],
          { padding: 30 }
        );
      });

      const status = document.querySelector('#selection-status');
      const selectButton = document.querySelector('#select-place');
      let selectedPoint = null;
      let selectedMarker = null;

      points.forEach((point) => {
        const markerElement = document.createElement('button');
        markerElement.type = 'button';
        markerElement.className = 'point-marker';
        markerElement.title = `${point.region}, точка №${point.id}`;

        const marker = new maplibregl.Marker({ element: markerElement })
          .setLngLat(point.coordinates)
          .addTo(map);

        markerElement.addEventListener('click', () => {
          if (selectedMarker) {
            selectedMarker.getElement().classList.remove('selected');
          }

          selectedPoint = point;
          selectedMarker = marker;
          markerElement.classList.add('selected');
          selectButton.disabled = false;
          status.textContent = `Выбрана точка №${point.id}: ${point.region}`;
        });
      });

      selectButton.addEventListener('click', () => {
        if (!selectedPoint) {
          return;
        }

        const placeData = {
          id: selectedPoint.id,
          region: selectedPoint.region,
          longitude: selectedPoint.coordinates[0],
          latitude: selectedPoint.coordinates[1]
        };

        console.log('Выбранное место:', placeData);
        status.textContent = 'Данные выбранного места записаны в консоль.';
      });
    </script>
  </body>
</html>
