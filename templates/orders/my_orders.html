{%extends "main.html"%}
{%load static%}

{%block cart%}

    <!-- Breadcrumb Start -->
    <div class="container-fluid">
        <div class="row px-xl-5">
            <div class="col-12">
                <nav class="breadcrumb bg-light mb-30">
                    <a class="breadcrumb-item text-dark" href="{%url 'index'%}">Home</a>
                    <span class="breadcrumb-item active">My Orders</span>
                </nav>
            </div>
        </div>
    </div>
    <!-- Breadcrumb End -->

    <!-- Orders Start -->
    <div class="container-fluid">
        <div class="row px-xl-5">
            <div class="col-lg-12 table-responsive mb-5">
                <table class="table table-light table-borderless table-hover text-center mb-0">
                    <thead class="thead-dark">
                        <tr>
                            <th>Order id</th>
                            <th>Quantity</th>
                            <th>Price</th>
                            <th>Date</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody class="align-middle">
                        {% for order in orders_made %}
                        <tr>
                            <td class="align-middle">{{ order.id }}</td>
                            <td class="align-middle">{{ order.order_total_quantity }}</td>
                            <td class="align-middle">${{ order.total_order_price }}</td>
                            <td class="align-middle">{{ order.date_added }}</td>
                            <td class="align-middle"><a class="btn btn-primary btn-sm" href="{%url 'order_detail' order.id%}">Details</a></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <!-- Orders End -->

{%endblock%}
